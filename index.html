<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#8FCB6B" />
    <meta name="description" content="Mine rocks, fill your pack, sell, upgrade, dig deeper. Free, no ads, works offline." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Quarry</title>
  </head>
  <body>
    <main>
      <canvas id="game" width="960" height="640" tabindex="0" aria-label="Quarry mining game"></canvas>
      <button id="save-button" class="round-button" aria-label="Open save card">⛏</button>
      <button id="update-toast" class="round-button update-toast" hidden aria-label="Update ready, tap to refresh">↻</button>
      <dialog id="save-dialog">
        <form method="dialog"><button class="close" aria-label="Close">×</button></form>
        <div class="save-mark">⛏</div>
        <img id="save-qr" alt="QR code for this save" />
        <a id="rescue-link" target="_blank" rel="noopener">↗</a>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
